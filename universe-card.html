<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Моя вселенная</title>
  <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: radial-gradient(circle at 50% 46%, #10184b 0, #080d2b 38%, #01020a 72%); color: #fff; font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif; }
    #scene { position: fixed; inset: 0; cursor: grab; touch-action: none; }
    #scene.dragging { cursor: grabbing; }
    .vignette { pointer-events: none; position: fixed; inset: 0; background: radial-gradient(circle at center, transparent 32%, rgba(0,0,12,.18) 68%, rgba(0,0,9,.84) 100%); }
    #memories { position: fixed; z-index: 2; inset: 0; pointer-events: none; overflow: hidden; }
    .memory { position: absolute; left: 0; top: 0; width: min(61px, 16vw); aspect-ratio: 1; padding: 3px; border: 1px solid rgba(255,220,237,.68); border-radius: 50%; background: rgba(40,15,46,.5); box-shadow: 0 7px 20px rgba(255,72,155,.3), inset 0 1px rgba(255,255,255,.35); color: #fff9fd; opacity: 0; cursor: pointer; pointer-events: auto; transition: opacity .5s, border-color .2s, box-shadow .2s; overflow: hidden; }
    .memory.visible { opacity: 1; }
    .memory:hover { border-color: rgba(255,236,245,.95); box-shadow: 0 0 24px rgba(255,126,183,.8), inset 0 1px rgba(255,255,255,.5); }
    .memory img { display: block; width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
    .memory p { display: none; }
    .controls { position: fixed; z-index: 3; right: clamp(18px, 4vw, 38px); top: clamp(18px, 4vw, 38px); }
    button { border: 1px solid rgba(255,255,255,.26); color: white; padding: 12px 16px; border-radius: 999px; background: rgba(9,12,33,.55); backdrop-filter: blur(12px); font: 500 13px/1 Inter, ui-sans-serif, system-ui, sans-serif; cursor: pointer; transition: background .2s, transform .2s, border-color .2s; white-space: nowrap; }
    button:hover { background: rgba(255,255,255,.17); border-color: rgba(255,255,255,.65); transform: translateY(-2px); }
    button:active { transform: translateY(0) scale(.97); }
    #add { width: 36px; height: 36px; padding: 0; border-radius: 50%; font-size: 23px; font-weight: 300; line-height: 31px; }
    dialog { z-index: 10; width: min(390px, calc(100% - 32px)); padding: 24px; color: white; border: 1px solid rgba(255,255,255,.22); border-radius: 22px; background: rgba(15,12,37,.96); box-shadow: 0 20px 80px rgba(0,0,0,.55); }
    dialog::backdrop { background: rgba(0,0,12,.64); backdrop-filter: blur(5px); }
    dialog h2 { margin: 0 0 7px; font: 400 22px Georgia, serif; }
    dialog p { margin: 0 0 18px; font-size: 13px; opacity: .7; }
    input { width: 100%; margin-top: 10px; padding: 13px 14px; color: white; border: 1px solid rgba(255,255,255,.26); border-radius: 12px; outline: 0; background: rgba(255,255,255,.08); font: 14px Inter, sans-serif; }
    input:focus { border-color: #ff91bc; box-shadow: 0 0 0 3px rgba(255,88,153,.16); }
    input[type=file] { padding: 10px; font-size: 12px; }
    .dialog-actions { display: flex; justify-content: flex-end; gap: 9px; margin-top: 14px; }
    .dialog-actions button:first-child { background: transparent; }
    #memory-viewer { width: min(520px, calc(100% - 30px)); padding: 8px; background: rgba(11,9,30,.96); }
    #memory-viewer img { display: block; width: 100%; max-height: 68vh; object-fit: contain; border-radius: 15px; }
    #memory-viewer p { margin: 12px 14px 9px; text-align: center; font-size: 14px; opacity: .9; }
    #memory-viewer button { position: absolute; top: 13px; right: 13px; width: 34px; height: 34px; padding: 0; background: rgba(9,12,33,.82); font-size: 22px; line-height: 25px; }
  </style>
</head>
<body>
  <canvas id="scene" aria-label="Интерактивная вселенная с сердцем и звёздами"></canvas>
  <div class="vignette"></div>
  <div id="memories" aria-live="polite"></div>
  <nav class="controls" aria-label="Добавить воспоминание"><button id="add" type="button" aria-label="Добавить воспоминание">+</button></nav>
  <dialog id="memory-dialog"><form method="dialog"><h2>Новое воспоминание</h2><p>Выберите фотографию и добавьте к ней короткую подпись.</p><input id="memory-photo" type="file" accept="image/*" required><input id="memory-text" maxlength="80" autocomplete="off" placeholder="Подпись к фотографии" required><div class="dialog-actions"><button value="cancel" type="submit">Отмена</button><button id="save-memory" value="default" type="submit">Добавить</button></div></form></dialog>
  <dialog id="action-dialog"><h2>Ваша вселенная</h2><p>Добавьте новое воспоминание или пригласите второго участника.</p><div class="dialog-actions"><button id="invite-partner" type="button">Пригласить</button><button id="open-memory" type="button">Добавить</button></div></dialog>
  <dialog id="telegram-only"><h2>Откройте в Telegram</h2><p>Эта личная вселенная доступна только внутри мини-приложения Telegram.</p></dialog>
  <dialog id="memory-viewer"><button id="close-viewer" type="button" aria-label="Закрыть">×</button><img id="viewer-image" alt=""><p id="viewer-caption"></p></dialog>
  <script>
    const telegram = window.Telegram?.WebApp;
    let initData = '', universe = null;
    const telegramOnly = document.getElementById('telegram-only');
    const api = (path, options = {}) => fetch(path, { ...options, headers: { ...(options.headers || {}), 'X-Telegram-Init-Data': initData } });
    const canvas = document.getElementById('scene'), ctx = canvas.getContext('2d');
    const memoriesEl = document.getElementById('memories');
    let w, h, dpr, yaw = .35, pitch = -.16, targetYaw = yaw, targetPitch = pitch, zoom = .76, dragging = false, px = 0, py = 0, pinchDistance = 0;
    const pointers = new Map();
    const stars = [];
    const memories = [];
    const renderedMemories = new Set();
    const palette = ['#ffffff', '#c5d9ff', '#ffd5ed', '#ffe7ac', '#b9ffff'];
    const rand = (a,b) => Math.random() * (b-a) + a;
    function star() {
      const r = rand(430, 1700), theta = rand(0, Math.PI * 2), z = rand(-1, 1), phi = Math.acos(z);
      return { x: r*Math.sin(phi)*Math.cos(theta), y: r*Math.cos(phi), z: r*Math.sin(phi)*Math.sin(theta), size: rand(.7, 3.1), color: palette[Math.floor(Math.random()*palette.length)], phase: rand(0, Math.PI*2) };
    }
    for (let i=0; i<240; i++) stars.push(star());
    function resize() { dpr = Math.min(devicePixelRatio || 1, 1.5); w = innerWidth; h = innerHeight; canvas.width=w*dpr; canvas.height=h*dpr; canvas.style.width=w+'px'; canvas.style.height=h+'px'; ctx.setTransform(dpr,0,0,dpr,0,0); }
    addEventListener('resize', resize); resize();
    function rotate(p) {
      const cy=Math.cos(yaw), sy=Math.sin(yaw), cp=Math.cos(pitch), sp=Math.sin(pitch);
      const x1=p.x*cy-p.z*sy, z1=p.x*sy+p.z*cy;
      return {x:x1, y:p.y*cp-z1*sp, z:p.y*sp+z1*cp};
    }
    function heart(t) { const s=13; return { x:s*Math.pow(Math.sin(t),3), y:s*(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))/16, z:0 }; }
    function glow(x,y,r,c,a=1) { const g=ctx.createRadialGradient(x,y,0,x,y,r); g.addColorStop(0, c.replace(')', ','+a+')').replace('rgb','rgba')); g.addColorStop(.25,c.replace(')', ','+(a*.35)+')').replace('rgb','rgba')); g.addColorStop(1,'rgba(0,0,0,0)'); ctx.fillStyle=g; ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill(); }
    function drawHeart() {
      const scale=Math.min(w,h)*.0085*zoom, cx=w/2, cy=h/2, sideX=scale*1.35, sideY=scale*2.05;
      const silhouette = (dx=0,dy=0) => { const points=[]; for(let i=0;i<240;i++){ const p=heart(i/240*Math.PI*2); points.push({x:cx+p.x*scale+dx,y:cy-p.y*scale+dy}); } ctx.beginPath(); points.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)); ctx.closePath(); };
      ctx.save();
      ctx.shadowColor='rgba(255,39,126,.7)'; ctx.shadowBlur=28; silhouette(sideX,sideY);
      const side=ctx.createLinearGradient(cx-scale*10,cy-scale*10,cx+scale*14,cy+scale*18); side.addColorStop(0,'#ef4e8a');side.addColorStop(.38,'#d51e62');side.addColorStop(1,'#920033');ctx.fillStyle=side;ctx.fill();ctx.shadowBlur=0;
      silhouette(); const face=ctx.createRadialGradient(cx-scale*5.2,cy-scale*8,scale*.2,cx,cy,scale*20); face.addColorStop(0,'#f58daf');face.addColorStop(.38,'#e55a8b');face.addColorStop(.75,'#d93772');face.addColorStop(1,'#bd1756');ctx.fillStyle=face;ctx.fill();
      ctx.save();silhouette();ctx.clip(); const gloss=ctx.createRadialGradient(cx-scale*5.6,cy-scale*8.2,0,cx-scale*4.5,cy-scale*7,scale*7.5); gloss.addColorStop(0,'rgba(255,255,255,.58)');gloss.addColorStop(.22,'rgba(255,224,237,.24)');gloss.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=gloss;ctx.beginPath();ctx.arc(cx-scale*4.5,cy-scale*7,scale*7.5,0,Math.PI*2);ctx.fill();ctx.restore();
      silhouette();ctx.strokeStyle='rgba(255,203,224,.62)';ctx.lineWidth=1;ctx.stroke();ctx.restore();
      glow(cx+sideX*.45,cy+sideY*.4,scale*24,'rgb(255,43,126)',.25);
    }
    function orbitPoint(memory, angle) {
      const a=angle+memory.node, r=memory.radius, tilt=memory.tilt;
      return rotate({ x:Math.cos(a)*r, y:Math.sin(a)*r*Math.sin(tilt), z:Math.sin(a)*r*Math.cos(tilt) });
    }
    function projectOrbitPoint(p) {
      const scale=Math.min(w,h)*.92*zoom, f=500/(p.z+800);
      return {x:w/2+p.x*scale*f,y:h/2-p.y*scale*f,f,z:p.z};
    }
    function drawOrbitRings() {
      ctx.save(); ctx.lineWidth=1; ctx.setLineDash([3,8]);
      memories.forEach(memory => { const points=[]; for(let i=0;i<=150;i++) points.push(projectOrbitPoint(orbitPoint(memory,i/150*Math.PI*2))); ctx.beginPath(); points.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)); ctx.strokeStyle='rgba(255,161,205,.18)'; ctx.stroke(); });
      ctx.setLineDash([]); ctx.restore();
    }
    function drawMemoryTethers() {
      const cx=w/2, cy=h/2;
      ctx.save(); ctx.lineWidth=1.35; ctx.lineCap='round';
      memories.forEach(memory => { if (!memory.x) return; const alpha=Math.max(.22, Math.min(.7, memory.opacity*.64)); const gradient=ctx.createLinearGradient(cx,cy,memory.x,memory.y); gradient.addColorStop(0,`rgba(255,125,177,${alpha})`); gradient.addColorStop(.72,`rgba(255,218,235,${alpha*.8})`); gradient.addColorStop(1,`rgba(255,255,255,${alpha*.45})`); ctx.strokeStyle=gradient; ctx.shadowColor='rgba(255,52,137,.48)'; ctx.shadowBlur=5; ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(memory.x,memory.y); ctx.stroke(); });
      ctx.restore();
    }
    function positionMemories(now) {
      const scale = Math.min(w,h) * .92 * zoom, orbitSpeed = now * .00028;
      memories.forEach((memory, index) => {
        const a = memory.angle + orbitSpeed * memory.speed;
        const p = orbitPoint(memory, a), f = 500 / (p.z + 800), x = w / 2 + p.x * scale * f, y = h / 2 - p.y * scale * f;
        const depth = Math.max(.58, Math.min(1.08, f));
        memory.el.style.transform = `translate(${x}px, ${y}px) translate(-50%, -50%) scale(${depth})`;
        memory.el.style.zIndex = String(Math.round(1000 + p.z));
        memory.opacity = p.z < -550 ? .2 : Math.min(1, .45 + f * .65); memory.x=x; memory.y=y;
        memory.el.style.opacity = String(memory.opacity);
      });
    }
    function render(now) {
      ctx.clearRect(0,0,w,h);
      const projected=[];
      for (const s of stars) { const p=rotate(s), f=600/(p.z+1900)*zoom; projected.push({s,p,x:w/2+p.x*f,y:h/2-p.y*f,f}); }
      projected.sort((a,b)=>a.p.z-b.p.z);
      for (const q of projected) { if(q.p.z<-1750) continue; const tw=.72+Math.sin(now*.0018+q.s.phase)*.28, r=Math.max(.35,q.s.size*q.f*2.2); ctx.globalAlpha=Math.min(1,.2+q.f)*tw; ctx.fillStyle=q.s.color; if(r<1.15) ctx.fillRect(q.x-r/2,q.y-r/2,r,r); else { ctx.beginPath();ctx.arc(q.x,q.y,r,0,Math.PI*2);ctx.fill(); } }
      ctx.globalAlpha=1;ctx.shadowBlur=0; drawOrbitRings(); positionMemories(now); drawMemoryTethers(); drawHeart(now);
      if(!dragging) targetYaw += .00065;
      yaw += (targetYaw-yaw)*.16; pitch += (targetPitch-pitch)*.16;
      requestAnimationFrame(render);
    }
    requestAnimationFrame(render);
    const dialog = document.getElementById('memory-dialog'), input = document.getElementById('memory-text'), photoInput = document.getElementById('memory-photo');
    const viewer = document.getElementById('memory-viewer'), viewerImage = document.getElementById('viewer-image'), viewerCaption = document.getElementById('viewer-caption');
    function addMemory(memory) {
      if (renderedMemories.has(memory.id)) return;
      renderedMemories.add(memory.id);
      const el = document.createElement('article'); el.className = 'memory';
      const image = document.createElement('img'); image.src = memory.photo; image.alt = memory.text;
      const caption = document.createElement('p'); caption.textContent = memory.text; el.append(image, caption); memoriesEl.append(el);
      el.onclick = () => { viewerImage.src = memory.photo; viewerImage.alt = memory.text; viewerCaption.textContent = memory.text; viewer.showModal(); };
      memories.push({ el, angle: Math.random()*Math.PI*2, radius: rand(.58,.94), tilt: rand(.12,.76), node: rand(0,Math.PI*2), speed: rand(.42,.95) });
      requestAnimationFrame(()=>el.classList.add('visible'));
    }
    async function loadMemories() { try { const response=await api('/.netlify/functions/memories'); if(response.ok) (await response.json()).forEach(addMemory); } catch (_) {} }
    async function resizePhoto(file) { const image = await createImageBitmap(file); const ratio = Math.min(1, 960 / Math.max(image.width, image.height)); const c = document.createElement('canvas'); c.width=image.width*ratio; c.height=image.height*ratio; c.getContext('2d').drawImage(image,0,0,c.width,c.height); return c.toDataURL('image/jpeg',.82); }
    const actionDialog=document.getElementById('action-dialog');
    document.getElementById('add').onclick=()=>actionDialog.showModal();
    document.getElementById('open-memory').onclick=()=>{actionDialog.close();dialog.showModal();setTimeout(()=>photoInput.focus(),30);};
    document.getElementById('invite-partner').onclick=async()=>{try{const response=await api('/.netlify/functions/invite-api',{method:'POST'});const data=await response.json();if(!response.ok) return telegram?.showAlert(data.error||'Не удалось создать приглашение.');const share=`https://t.me/share/url?url=${encodeURIComponent(data.url)}&text=${encodeURIComponent('Это наша личная вселенная 💗')}`;telegram?.openTelegramLink(share);actionDialog.close();}catch(_){telegram?.showAlert('Не удалось создать приглашение.');}};
    dialog.addEventListener('close',async()=>{const text=input.value.trim(), photo=photoInput.files[0]; input.value=''; photoInput.value=''; if(dialog.returnValue!=='default' || !text || !photo) return; try { const response=await api('/.netlify/functions/memories',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text,photo:await resizePhoto(photo)})}); if(response.ok) addMemory(await response.json()); } catch (_) {} });
    document.getElementById('close-viewer').onclick=()=>viewer.close();
    const clampZoom = value => Math.max(.48, Math.min(1.55, value));
    const pointerDistance = () => { const [a,b] = [...pointers.values()]; return Math.hypot(a.x-b.x, a.y-b.y); };
    canvas.addEventListener('wheel', e => { e.preventDefault(); zoom = clampZoom(zoom * (e.deltaY > 0 ? .91 : 1.1)); }, { passive: false });
    canvas.addEventListener('pointerdown',e=>{pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});dragging=pointers.size===1;px=e.clientX;py=e.clientY;if(pointers.size===2)pinchDistance=pointerDistance();canvas.classList.toggle('dragging',dragging);canvas.setPointerCapture(e.pointerId);});
    canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===2){const distance=pointerDistance();if(pinchDistance)zoom=clampZoom(zoom*distance/pinchDistance);pinchDistance=distance;return;}if(!dragging)return;targetYaw+=(e.clientX-px)*.008;targetPitch=Math.max(-1.35,Math.min(1.35,targetPitch+(e.clientY-py)*.008));px=e.clientX;py=e.clientY;});
    function releasePointer(e){pointers.delete(e.pointerId);dragging=pointers.size===1;if(dragging){const point=[...pointers.values()][0];px=point.x;py=point.y;}else pinchDistance=0;canvas.classList.toggle('dragging',dragging);}
    canvas.addEventListener('pointerup',releasePointer);canvas.addEventListener('pointercancel',releasePointer);
    async function startTelegramUniverse(){
      if(!telegram?.initData){telegramOnly.showModal();return;}
      telegram.ready();telegram.expand();initData=telegram.initData;
      const startParam=telegram.initDataUnsafe?.start_param||new URLSearchParams(location.search).get('tgWebAppStartParam')||'';
      try{const response=await api(`/.netlify/functions/universe-api${startParam?`?startParam=${encodeURIComponent(startParam)}`:''}`);const data=await response.json();if(!response.ok) return telegram.showAlert(data.error||'Не удалось открыть вселенную.');universe=data.universe;await loadMemories();setInterval(loadMemories,12000);}catch(_){telegram.showAlert('Нет соединения с вашей вселенной.');}
    }
    startTelegramUniverse();
  </script>
</body>
</html>
